[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sll-core"
version = "0.1.8"
description = "Static Local Linearization (SLL): zero-intrusive auto-differentiation for discrete programs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "SLL Team", email = "15011462616@163.com"}
]
keywords = ["autograd", "differentiable", "discrete", "optimization", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=1.9.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
]

[project.urls]
Homepage = "https://github.com/jacksong-sourse/sll-core"
Repository = "https://github.com/jacksong-sourse/sll-core"
Issues = "https://github.com/jacksong-sourse/sll-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["sll"]
